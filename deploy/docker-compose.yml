# Local dev stack for the dashboard, embedded-first.
#
#   ./run dev          # build + start the server and frontend (Ctrl-C to stop)
#   ./run down [-v]    # stop and remove it
#
# The combined image (deploy/Dockerfile --target prod) runs the Rust backend,
# Caddy, and the syslog collector under one supervisor. The default (no
# DATABASE_URL) uses embedded Turso; start the optional Postgres overlay for a
# real Postgres backend:
#
#   docker compose -f deploy/docker-compose.yml \
#       -f deploy/docker-compose.postgres.yml up --build
#
# The backend uses the combined production image. A separate Bun frontend
# watches mounted source and proxies API requests through the backend's Caddy.
#
# Container names here are scoped to this dev stack (quip-dashboard-dev) and do
# not collide with a live node's quip-dashboard container or volumes.
services:
  dashboard:
    image: quip-dashboard-local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: prod
    container_name: quip-dashboard-dev
    stop_grace_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      # Override these URLs to reach a validator and miner from the container.
      # The defaults leave the API live while upstreams are unavailable.
      QUIP_VALIDATOR_RPC_URLS: ${QUIP_VALIDATOR_RPC_URLS:-ws://127.0.0.1:9944}
      QUIP_MINER_REST_URL: ${QUIP_MINER_REST_URL:-http://127.0.0.1:8086}
      QUIP_HOSTNAME: ${QUIP_HOSTNAME:-:20049}
      CERT_EMAIL: ${CERT_EMAIL:-hostmaster@localhost}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Caddy state under /data, separate from the embedded database.
      XDG_DATA_HOME: /data/caddy/data
      XDG_CONFIG_HOME: /data/caddy/config
    volumes:
      - dashboard-data:/data
      - dashboard-logs:/logs
    ports:
      - "${NODE_HTTP_PORT:-8080}:20049" # public Caddy (HTTP) -> :20049
      - "127.0.0.1:${QUIP_LOG_PORT:-5514}:5514/udp" # syslog collector (loopback)
    # No container-wide capability is added: Caddy carries
    # cap_net_bind_service as a file capability on its binary (see
    # deploy/Dockerfile), so it binds the public low ports without a
    # privileged image.
    logging:
      driver: json-file
      options:
        max-size: ${QUIP_LOG_MAX_SIZE:-32m}
        max-file: "${QUIP_LOG_MAX_FILE:-5}"
    healthcheck:
      # Liveness through the backend's process HTTP check; never a second DB.
      test: ["CMD", "/usr/local/bin/quip-dashboard", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: quip-dashboard-dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: dev
    environment:
      VITE_API_PROXY: ${VITE_API_PROXY:-http://dashboard:20049}
    volumes:
      - ../apps/frontend/src:/app/apps/frontend/src
      - ../apps/frontend/public:/app/apps/frontend/public
      - ../apps/frontend/index.html:/app/apps/frontend/index.html:ro
      - ../apps/frontend/vite.config.ts:/app/apps/frontend/vite.config.ts:ro
      - ../apps/frontend/tsconfig.json:/app/apps/frontend/tsconfig.json:ro
      - ../packages/shared:/app/packages/shared
      - ../tsconfig.base.json:/app/tsconfig.base.json:ro
    ports:
      - "127.0.0.1:${FRONTEND_DEV_PORT:-5173}:5173"
    depends_on:
      - dashboard
    command: ["bun", "run", "--filter", "@quip/frontend", "dev", "--host", "0.0.0.0"]

volumes:
  dashboard-data:
  dashboard-logs:
