# Static frontend; VITE_API_BASE_URL identifies the separately hosted Rust API.
# Netlify package directory: apps/frontend. Base directory: repository root.
[build]
  command = ': "${VITE_API_BASE_URL:?Set VITE_API_BASE_URL to the public Rust API origin}" && bun run build'
  publish = "dist"

[dev]
  command = "vite --host 0.0.0.0"
  targetPort = 5173

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
