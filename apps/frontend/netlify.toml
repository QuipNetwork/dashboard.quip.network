# Netlify is pointed at this file via the site's Package directory = apps/frontend
# (Base directory = repo root). Relative paths below resolve from apps/frontend,
# which is why `publish = "dist"` lands on apps/frontend/dist and the function
# directory is reached with a `../` hop into @quip/server.
[build]
  command = "bun run build"
  publish = "dist"

[dev]
  command = "vite --host 0.0.0.0"
  targetPort = 5173

[functions]
  directory = "../server/netlify"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/telemetry*"
  to = "/.netlify/functions/telemetry/:splat"
  status = 200
