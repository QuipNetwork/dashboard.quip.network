# GitLab CI/CD for Quip Dashboard
# Tests on branches, builds on master/tags (and MRs for verification)

stages:
  - test
  - build
  - manifest

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug

# ---------------------------------------------------------------------------
# Tests (branches + MRs — master/tags skip straight to build)
# ---------------------------------------------------------------------------

test:
  stage: test
  image: oven/bun:1
  tags: [linux, amd64]
  script:
    - bun install --frozen-lockfile
    - bunx tsc --noEmit
    - bun run format:check
    - bun test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Docker image build — multi-arch via Kaniko.
#
# Kaniko executes RUN natively (no built-in QEMU), so each platform image
# must be built on a native runner of that arch. Each leg pushes a
# $SHA-$ARCH-suffixed tag; the manifest stage stitches them into a single
# OCI manifest list under the canonical tags.
#
# Runner mapping (see Settings → CI/CD → Runners):
#   amd64 → `lovelace`  — Linux docker executor; kaniko runs as the job image.
#   arm64 → `tesla-arm` — macOS shell executor; kaniko runs via `docker run`
#                         against the host's Docker Desktop / OrbStack.
# ---------------------------------------------------------------------------

build-image-amd64:
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  tags: [linux, amd64]
  variables:
    ARCH: amd64
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile Dockerfile
      --destination $IMAGE:$CI_COMMIT_SHA-$ARCH
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-image-arm64:
  stage: build
  tags: [macos, arm64]
  variables:
    ARCH: arm64
  before_script:
    # Shell executor: kaniko runs via `docker run`, not as the job image.
    # Auth config is prepped in a tempdir and bind-mounted into kaniko.
    - KANIKO_CFG="$(mktemp -d)"
    - AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > "$KANIKO_CFG/config.json"
  script:
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/workspace" \
        -v "$KANIKO_CFG:/kaniko/.docker:ro" \
        "$KANIKO_IMAGE" \
        --context /workspace \
        --dockerfile /workspace/Dockerfile \
        --destination "$IMAGE:$CI_COMMIT_SHA-$ARCH"
  after_script:
    # Scrub the creds file even if the script fails.
    - rm -rf "${KANIKO_CFG:-}"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Manifest list — combine the two per-arch images under the canonical tags.
# Runs once after both per-arch builds succeed.
# ---------------------------------------------------------------------------

manifest:
  stage: manifest
  image:
    name: mplatform/manifest-tool:alpine-v2.1.8
    entrypoint: [""]
  tags: [linux, amd64]
  needs:
    - build-image-amd64
    - build-image-arm64
  script:
    - |
      set -eu
      TARGETS="$IMAGE:$CI_COMMIT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "master" ] || [ -n "$CI_COMMIT_TAG" ]; then
        TARGETS="$TARGETS $IMAGE:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        TARGETS="$TARGETS $IMAGE:$CI_COMMIT_TAG"
      fi
      for T in $TARGETS; do
        manifest-tool \
          --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" \
          push from-args \
          --platforms linux/amd64,linux/arm64 \
          --template "$IMAGE:$CI_COMMIT_SHA-ARCH" \
          --target "$T"
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
