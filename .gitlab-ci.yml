# GitLab CI/CD for Quip Dashboard
#
# Triggers:
#   - merge_request_event  →  test + build (SHA-tagged only, for verification)
#   - push to main       →  build + publish (:latest)
#   - push to v0.2         →  build + publish (:v0.2)   # rolling v0.2 line
#   - git tag vX.Y.Z       →  build + publish (:latest, :vX.Y, :<tag>)
#   - git tag vX.Y.Z-<pre> →  build + publish (:vX.Y, :<tag>)   # no :latest
#                             (pre-release: SemVer hyphenated rc/alpha/beta,
#                              e.g. v0.2.1-rc18 — NOT the PEP 440 no-hyphen
#                              v0.2.1rc18; see quip-protocol/docs/VERSIONING.md.
#                              The series/:latest logic below is format-agnostic,
#                              so both build, but use the hyphenated standard.)

stages:
  - test
  - build
  - manifest

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug

# ---------------------------------------------------------------------------
# Tests (branches + MRs — main/tags skip straight to build)
# ---------------------------------------------------------------------------

test:
  stage: test
  image: oven/bun:1
  tags: [docker, amd64]
  script:
    - bun install --frozen-lockfile
    - bunx tsc --noEmit
    - bun run format:check
    - bun test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Docker image build — multi-arch via Kaniko.
#
# Kaniko executes RUN natively (no built-in QEMU), so each platform image must
# be built on a native runner of that arch. Each leg pushes a $SHA-$ARCH tag;
# the manifest stage stitches them into a single OCI manifest list under the
# canonical tags.
#
# The `docker` tag is load-bearing: it pins these jobs to *container* (Docker)
# executors, which honour `image:` and can run kaniko. The fleet also has macOS
# *shell* runners carrying the bare arch tags (amd64/arm64) that ignore
# `image:` and run on the SIP-protected host — kaniko cannot run there.
#
# Runner mapping (see Settings → CI/CD → Runners):
#   amd64 → lovelace/finney/watch — Linux docker executors (tags: docker,amd64)
#   arm64 → cray-docker           — docker executor on an Apple-Silicon Mac
#                                    (OrbStack; tags: docker,arm64)
# ---------------------------------------------------------------------------

# Publish rules shared by both build legs and the manifest job.
.build-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "v0.2"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.build-image:
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  rules: !reference [.build-rules, rules]
  before_script:
    # The amd64 cuda runners' NVIDIA container runtime bind-mounts host GPU
    # firmware into every job container at /lib/firmware/nvidia/, so kaniko runs
    # with --ignore-path=/lib (it cannot replace /lib with the usr-merge symlink
    # while those mounts are busy). That skips the multilib dir, so recreate it
    # for this arch's triplet; the ELF interpreter then resolves through
    # /lib/$TRIPLET. arm64 (OrbStack) has no firmware mount and on aarch64 the
    # interpreter /lib/ld-linux-aarch64.so.1 lives directly in /lib — ignoring
    # /lib there breaks every RUN — so it sets neither KANIKO_LIB_IGNORE nor
    # TRIPLET.
    - if [ -n "$KANIKO_LIB_IGNORE" ]; then mkdir -p /lib && ln -sfn /usr/lib/$TRIPLET /lib/$TRIPLET; fi
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile Dockerfile
      --destination $IMAGE:$CI_COMMIT_SHA-$ARCH
      $KANIKO_LIB_IGNORE
      $KANIKO_EXTRA

build-image-amd64:
  extends: .build-image
  tags: [docker, amd64]
  variables:
    ARCH: amd64
    TRIPLET: x86_64-linux-gnu
    KANIKO_LIB_IGNORE: "--ignore-path=/lib"

build-image-arm64:
  extends: .build-image
  tags: [docker, arm64]
  variables:
    ARCH: arm64
    # Defensive on the constrained OrbStack VM: kaniko's default compressed
    # caching holds layers in RAM during snapshotting and can OOM-freeze the
    # daemon. Stream to disk instead. (No GPU /lib workaround on this runner.)
    KANIKO_EXTRA: "--compressed-caching=false"

# ---------------------------------------------------------------------------
# Manifest list — combine the per-arch images under the canonical tags.
# Runs once after both per-arch builds succeed.
# ---------------------------------------------------------------------------

manifest:
  stage: manifest
  image:
    name: mplatform/manifest-tool:alpine-v2.1.8
    entrypoint: [""]
  tags: [docker, amd64]
  needs:
    - build-image-amd64
    - build-image-arm64
  rules: !reference [.build-rules, rules]
  script:
    # Tag pipelines leave CI_COMMIT_BRANCH unset and branch pipelines leave
    # CI_COMMIT_TAG unset — default each to empty so the checks are safe.
    - |
      TARGETS="$IMAGE:$CI_COMMIT_SHA"
      if [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
        TARGETS="$TARGETS $IMAGE:latest"
      fi
      if [ "${CI_COMMIT_BRANCH:-}" = "v0.2" ]; then
        # The active v0.2 line: each branch push rolls the floating :v0.2 tag
        # that the stack pulls. A release tag (vX.Y.Z<pre>) later re-pins :v0.2
        # and adds the immutable :<tag>.
        TARGETS="$TARGETS $IMAGE:v0.2"
      fi
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        # Immutable, exact-version tag (e.g. v0.2.0rc1).
        TARGETS="$TARGETS $IMAGE:$CI_COMMIT_TAG"
        # Floating minor-line tag: v0.2.0rc1 -> v0.2.
        MINOR="$(printf '%s' "$CI_COMMIT_TAG" | sed -E 's/^(v[0-9]+\.[0-9]+).*/\1/')"
        if [ "$MINOR" != "$CI_COMMIT_TAG" ]; then
          TARGETS="$TARGETS $IMAGE:$MINOR"
        fi
        # :latest only for stable releases — never for rc/alpha/beta pre-releases.
        if printf '%s' "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          TARGETS="$TARGETS $IMAGE:latest"
        fi
      fi
      for T in $TARGETS; do
        manifest-tool \
          --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" \
          push from-args \
          --platforms linux/amd64,linux/arm64 \
          --template "$IMAGE:$CI_COMMIT_SHA-ARCH" \
          --target "$T"
      done
