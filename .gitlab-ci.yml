# GitLab CI/CD for Quip Dashboard
# Tests on branches, builds on master/tags (and MRs for verification)

stages:
  - test
  - build

variables:
  IMAGE: $CI_REGISTRY_IMAGE

# ---------------------------------------------------------------------------
# Tests (branches + MRs — master/tags skip straight to build)
# ---------------------------------------------------------------------------

test:
  stage: test
  image: oven/bun:1
  tags: [linux, amd64]
  script:
    - bun install --frozen-lockfile
    - bunx tsc --noEmit
    - bun run format:check
    - bun test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Docker image build (Kaniko — no daemon required)
# ---------------------------------------------------------------------------

build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags: [linux, amd64]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      DESTS="--destination $IMAGE:$CI_COMMIT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "master" ] || [ -n "$CI_COMMIT_TAG" ]; then
        DESTS="$DESTS --destination $IMAGE:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTS="$DESTS --destination $IMAGE:$CI_COMMIT_TAG"
      fi
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        $DESTS
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
