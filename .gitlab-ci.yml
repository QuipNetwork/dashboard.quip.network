# GitLab CI/CD for Quip Dashboard
#
# Triggers:
#   - merge_request_event  →  test
#   - push to any branch   →  test (no image build/publish — merging into
#                             main/v0.2 must NOT roll the floating tags the
#                             deployed stacks pull; releases are cut by tagging)
#   - git tag vX.Y.Z       →  build + publish (:latest, :vX.Y, :<tag>)
#   - git tag vX.Y.Z-<pre> →  build + publish (:vX.Y, :<tag>)   # no :latest
#                             (pre-release tags are hyphenated SemVer, e.g.
#                             v0.2.1-rc18 — see AGENTS.md "Versioning & release
#                             tags" / quip-protocol/docs/VERSIONING.md)

stages:
  - test
  - build
  - manifest

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug

# ---------------------------------------------------------------------------
# Tests (branches + MRs — tags skip straight to build; the tagged commit is a
# branch head that already passed this job)
# ---------------------------------------------------------------------------

test:
  stage: test
  image: oven/bun:1
  tags: [linux, amd64]
  script:
    - bun install
    - bun run typecheck
    - bun run format:check
    - bun test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Docker image build — multi-arch via Kaniko.
#
# Kaniko executes RUN natively (no built-in QEMU), so each platform image
# must be built on a native runner of that arch. Each leg pushes a
# $SHA-$ARCH-suffixed tag; the manifest stage stitches them into a single
# OCI manifest list under the canonical tags.
#
# Runner mapping (see Settings → CI/CD → Runners):
#   amd64 → `lovelace` (linux,amd64,docker,cuda) — kaniko runs as the job image.
#   arm64 → `cray-docker` (arm64,docker) — the only arm64 docker runner;
#           `tesla-arm`/`cray` are macOS (no docker executor for kaniko).
# ---------------------------------------------------------------------------

build-image-amd64:
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  tags: [linux, amd64]
  variables:
    ARCH: amd64
  before_script:
    # The cuda runners' NVIDIA container runtime bind-mounts host GPU driver
    # firmware into every job container at /lib/firmware/nvidia/. kaniko's
    # rootfs extraction cannot replace /lib with the usr-merge symlink while
    # those mounts are busy, so the executor runs with --ignore-path=/lib,
    # which skips that replacement and preserves /lib as a plain directory.
    # The ELF interpreter resolves through /lib/x86_64-linux-gnu (via the
    # /lib64 → /usr/lib64 → /lib/x86_64-linux-gnu symlink chain), so RUN
    # commands need this shim. It dangles until kaniko unpacks the rootfs,
    # and never reaches the image: /lib is excluded from snapshots and the
    # final image's /lib symlink comes from the base layers.
    - mkdir -p /lib && ln -sfn /usr/lib/x86_64-linux-gnu /lib/x86_64-linux-gnu
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile deploy/Dockerfile
      --destination $IMAGE:$CI_COMMIT_SHA-$ARCH
      --ignore-path=/lib

  rules:
    - if: $CI_COMMIT_TAG

build-image-arm64:
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  tags: [docker, arm64]
  variables:
    ARCH: arm64
    # Stream layers to disk: kaniko's default compressed caching holds layers
    # in RAM during snapshotting and can OOM the constrained arm64 runner.
    KANIKO_EXTRA: "--compressed-caching=false"
  before_script:
    # No GPU /lib shim — the arm64 runner (cray-docker) is not a cuda host, so
    # there are no firmware bind-mounts blocking kaniko's rootfs extraction.
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile deploy/Dockerfile
      --destination $IMAGE:$CI_COMMIT_SHA-$ARCH
      $KANIKO_EXTRA
  rules:
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Manifest list — combine the two per-arch images under the canonical tags.
# Runs once after both per-arch builds succeed.
# ---------------------------------------------------------------------------

manifest:
  stage: manifest
  image:
    name: mplatform/manifest-tool:alpine-v2.1.8
    entrypoint: [""]
  tags: [linux, amd64]
  needs:
    - build-image-amd64
    - build-image-arm64
  script:
    - |
      # Immutable tags first: the exact SHA and the exact release tag
      # (e.g. v0.2.1-rc18).
      TARGETS="$IMAGE:$CI_COMMIT_SHA $IMAGE:$CI_COMMIT_TAG"
      # Floating minor-line tag the deployed stacks pull: v0.2.1-rc18 -> v0.2.
      # Format-agnostic, so a hyphenated pre-release resolves to the same
      # series as a stable tag.
      MINOR="$(printf '%s' "$CI_COMMIT_TAG" | sed -E 's/^(v[0-9]+\.[0-9]+).*/\1/')"
      if [ "$MINOR" != "$CI_COMMIT_TAG" ]; then
        TARGETS="$TARGETS $IMAGE:$MINOR"
      fi
      # :latest only for stable releases — never for rc/alpha/beta pre-releases.
      if printf '%s' "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        TARGETS="$TARGETS $IMAGE:latest"
      fi
      for T in $TARGETS; do
        manifest-tool \
          --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" \
          push from-args \
          --platforms linux/amd64,linux/arm64 \
          --template "$IMAGE:$CI_COMMIT_SHA-ARCH" \
          --target "$T"
      done
  rules:
    - if: $CI_COMMIT_TAG
