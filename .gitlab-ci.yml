# GitLab CI/CD for Quip Dashboard
#
# Triggers:
#   - merge_request_event  →  test
#   - push to any branch   →  test (no image build/publish — merging into
#                             main/v0.2 must NOT roll the floating tags the
#                             deployed stacks pull; releases are cut by tagging)
#   - git tag vX.Y.Z       →  build + publish (:<tag>, :sha); also :vX.Y,
#                             :latest, :stable, and :beta when the commit is
#                             reachable from origin/main (see
#                             resolve-floating-tags)
#   - git tag vX.Y.Z-rcN   →  build + publish (:<tag>, :sha); also :beta when
#                             the commit is reachable from origin/main
#                             (pre-release tags are hyphenated SemVer, e.g.
#                             v0.2.1-rc18 — see AGENTS.md "Versioning & release
#                             tags" / quip-protocol/docs/VERSIONING.md)

stages:
  - test
  - build
  - manifest

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug

# ---------------------------------------------------------------------------
# Tests (branches + MRs — tags skip straight to build; the tagged commit is a
# branch head that already passed this job)
# ---------------------------------------------------------------------------

test:
  stage: test
  image: oven/bun:1
  tags: [linux, amd64]
  script:
    - bun install --frozen-lockfile
    - bun run typecheck
    - bun run format:check
    - bun run build
    - bun test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Rust workspace checks. The JavaScript job covers the frontend SPA and shared
# contract only; the Rust tree is the server implementation.

# Heavy Rust jobs keep Cargo state on a host volume, not in the GitLab tar
# cache. See docs/ci-cache.md for the host setup. The tar cache cannot hold a
# Rust target/ on this workspace and misses across runner hosts, so it never
# warmed; the host volume persists between pipelines on one host.
#
# CARGO_HOME is shared: the registry is read-mostly and Cargo locks it
# correctly. CI_CONCURRENT_ID scopes the target dir to the runner execution
# slot, so two pipelines on one host build in separate directories instead of
# serializing on Cargo's target lock. Slots are reused across pipelines,
# which is what keeps a directory warm.
#
# Pruning is a host concern — a scheduled CI job only ever lands on one
# runner. Each host needs its own sweep of the volume; see docs/ci-cache.md.
.cargo-host-cache:
  variables:
    CARGO_HOME: /ci-cache/cargo-home
    CARGO_TARGET_DIR: /ci-cache/$CI_CONCURRENT_ID/$CI_JOB_NAME/target
  cache: []

rust:
  stage: test
  image: rust:1.98.1-bookworm
  tags: [linux, amd64]
  extends: .cargo-host-cache
  services:
    - name: postgres:16
      alias: postgres
  variables:
    CARGO_TERM_COLOR: always
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: dashboard-ci-only
    POSTGRES_DB: postgres
    PGHOST: 127.0.0.1
    PGUSER: postgres
    PGPASSWORD: dashboard-ci-only
    STORE_TEST_POSTGRES_URL: postgresql://postgres:dashboard-ci-only@127.0.0.1:5432/postgres
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 postgresql-client socat
    - rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
    - rustup default 1.98.1
    - rustc --version
    # Destructive test helpers only accept loopback URLs and unique test databases.
    - socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:postgres:5432 &
    - for _attempt in $(seq 1 30); do pg_isready && break; sleep 1; done
    - pg_isready
  script:
    # Cargo judges workspace crates fresh by file mtime, so a reused host
    # target dir can serve a stale build of our own crates. Rebuild them every
    # run; third-party dependencies stay cached. See docs/ci-cache.md.
    - cargo clean -p dashboard-model -p dashboard-store -p quip-dashboard
    - cargo install cargo-deny --locked --version 0.20.2
    - cargo deny check
    - cargo fmt --all -- --check
    - cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
    - cargo test --locked --workspace
    - cargo test --locked -p dashboard-store -- --ignored --test-threads=1
    - |
      for test_case in head pressure; do
        test_database="quip_indexer_pressure_${CI_JOB_ID}_${test_case}"
        createdb "$test_database"
        trap 'dropdb --if-exists --force "$test_database"' EXIT
        export QUIP_INDEXER_TEST_POSTGRES_URL="postgresql://postgres:dashboard-ci-only@127.0.0.1:5432/$test_database"
        if [ "$test_case" = head ]; then
          cargo test --locked -p quip-dashboard --lib received_finalized_head_remains_visible_while_target_write_is_blocked -- --ignored
        else
          cargo test --locked -p quip-dashboard --test indexer_replay postgres_pressure_keeps_all_permits_until_database_commit -- --ignored
        fi
        dropdb --force "$test_database"
        trap - EXIT
      done
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Docker image build — multi-arch via Kaniko.
#
# Kaniko executes RUN natively (no built-in QEMU), so each platform image
# must be built on a native runner of that arch. Each leg pushes a
# $SHA-$ARCH-suffixed tag; the manifest stage stitches them into a single
# OCI manifest list under the canonical tags.
#
# Runner mapping (see Settings → CI/CD → Runners):
#   amd64 → `lovelace` (linux,amd64,docker,cuda) — kaniko runs as the job image.
#   arm64 → `cray-docker` (arm64,docker) — the only arm64 docker runner;
#           `tesla-arm`/`cray` are macOS (no docker executor for kaniko).
# ---------------------------------------------------------------------------

build-image-amd64:
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  tags: [linux, amd64]
  variables:
    ARCH: amd64
  before_script:
    # Every build stage uses Alpine, so /lib stays a directory across stages.
    # Exclude only the mounted GPU firmware subtree. Excluding all of /lib
    # would also prevent Kaniko from extracting Alpine's musl loader.
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile deploy/Dockerfile
      --destination $IMAGE:$CI_COMMIT_SHA-$ARCH
      --ignore-path=/lib/firmware/nvidia

  rules:
    - if: $CI_COMMIT_TAG

build-image-arm64:
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  tags: [docker, arm64]
  variables:
    ARCH: arm64
    # Stream layers to disk: kaniko's default compressed caching holds layers
    # in RAM during snapshotting and can OOM the constrained arm64 runner.
    KANIKO_EXTRA: "--compressed-caching=false"
  before_script:
    # No GPU /lib shim — the arm64 runner (cray-docker) is not a cuda host, so
    # there are no firmware bind-mounts blocking kaniko's rootfs extraction.
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile deploy/Dockerfile
      --destination $IMAGE:$CI_COMMIT_SHA-$ARCH
      $KANIKO_EXTRA
  rules:
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Resolve floating tags for a release tag. Policy:
#   - stable vX.Y.Z reachable from origin/main: :latest, :vX.Y, :stable, :beta.
#   - rc vX.Y.Z-rcN reachable from origin/main: :beta.
#   - any other tag, or a tag not on main: no floating tags.
# :stable and :beta are the channels nodes.quip.network pulls through CHANNEL.
# A release moves :beta too, because it is newer than every rc before it. The
# main-ancestry check keeps a tag on an old maintenance branch from moving a
# channel backwards.
#
# Tag pipelines have no CI_COMMIT_BRANCH, so commit ancestry decides. The
# manifest-tool image has no git and jobs may be shallow; this job uses a
# full clone (GIT_DEPTH 0) + alpine/git to run merge-base, then passes the
# result to manifest via dotenv. Immutable :$CI_COMMIT_SHA and :$CI_COMMIT_TAG
# are always published by manifest regardless of this job's output.
# ---------------------------------------------------------------------------

resolve-floating-tags:
  stage: build
  needs: []
  image:
    name: alpine/git:latest
    entrypoint: [""]
  tags: [linux, amd64]
  variables:
    GIT_DEPTH: "0"
  script:
    - git fetch origin main
    - |
      # Space-separated; empty when no floating tag applies.
      FLOATING_TAGS=""
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; then
        if printf '%s' "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          MINOR_TAG="$(printf '%s' "$CI_COMMIT_TAG" | sed -E 's/^(v[0-9]+\.[0-9]+).*/\1/')"
          FLOATING_TAGS="latest $MINOR_TAG stable beta"
        elif printf '%s' "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$'; then
          FLOATING_TAGS="beta"
        fi
      fi
      echo "FLOATING_TAGS=$FLOATING_TAGS" > floating-tags.env
      echo "resolved FLOATING_TAGS='$FLOATING_TAGS' for $CI_COMMIT_TAG ($CI_COMMIT_SHA)"
  artifacts:
    reports:
      dotenv: floating-tags.env
  rules:
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Manifest list — combine the two per-arch images under the canonical tags.
# Runs once after both per-arch builds succeed.
# ---------------------------------------------------------------------------

manifest:
  stage: manifest
  image:
    name: mplatform/manifest-tool:alpine-v2.1.8
    entrypoint: [""]
  tags: [linux, amd64]
  needs:
    - build-image-amd64
    - build-image-arm64
    - resolve-floating-tags
  script:
    - |
      # Immutable tags always: the exact SHA and the exact release tag
      # (e.g. v0.2.1-rc18 or v0.2.1).
      TARGETS="$IMAGE:$CI_COMMIT_SHA $IMAGE:$CI_COMMIT_TAG"
      # Floating tags as resolve-floating-tags decided (may be none).
      for F in $FLOATING_TAGS; do
        TARGETS="$TARGETS $IMAGE:$F"
      done
      for T in $TARGETS; do
        manifest-tool \
          --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" \
          push from-args \
          --platforms linux/amd64,linux/arm64 \
          --template "$IMAGE:$CI_COMMIT_SHA-ARCH" \
          --target "$T"
      done
  rules:
    - if: $CI_COMMIT_TAG
